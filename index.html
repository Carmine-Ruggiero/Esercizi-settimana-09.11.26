<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-primary border border-primary">
      <div class="container-fluid">
        <!-- 1. Il Brand/Logo (opzionale, ma standard a sinistra) -->
        <a class="navbar-brand" href="#">EpiShop</a>
        <div class="collapse navbar-collapse">

          <ul class="navbar-nav text-center ms-md-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Active</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>


  <!-- Sezione -->
  <section class="py-5">
    <div class="container text-center fw-bold">
      <div class="row">
        <div class="col-lg-8 mx-auto fw-3">
          <h2>Saldi di primavera</h2>
        </div>

        <div>
          <p>Scopri le offerte sui prodotti in evidenza, fino al 50% di sconto</p>
        </div>
      </div>
      <button type="button" class="btn btn-primary"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
        Vedi i prodotti
      </button>
    </div>
  </section>

  <main class="container my-4">

    <div class="row">

      <aside>
        <h5 class="fw-bold mb-3 tezt-primary">Categorie</h5>
        <ul class="list-unstyled d-grid gap-2 m-0">
          <li><a href="#" class="text-secondary text-decoration-none link-dark">Scarpe</a></li>
          <li><a href="#" class="text-secondary text-decoration-none link-dark">T-shirt</a></li>
          <li><a href="#" class="text-secondary text-decoration-none link-dark">Borse</a></li>
          <li><a href="#" class="text-secondary text-decoration-none link-dark">Accessori</a></li>
        </ul>
      </aside>

      <section>
        <!-- Griglia prodotti responsive (1 / 2 / 3 / 4 per riga in base al breakpoint) -->
      </section>

    </div>
  </main>

  <footer>
    <!-- Footer scuro centrato con copyright -->
  </footer>

</body>

</html>
